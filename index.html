<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ed">
<meta name="description" content="New Delhi Darbar Restaurant digital menu">
<title>New Delhi Darbar — Menu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<script src="menu-fallback.js"></script>
<style>
   :root{
    --bg:#f5f2ed;
    --surface:#faf8f5;
    --surface-2:#ece8e2;
    --text:#1a1816;
    --muted:#6b6460;
    --line:#dad5cf;
    --accent:#e0824a;
    --accent-soft:#f0e4da;
    --shadow:0 14px 36px rgba(30,24,18,.06);
    --watermark:rgba(26,24,22,.055);
    --radius:14px;
    --max:1120px;
  }
  html[data-theme="dark"]{
    --bg:#121110;
    --surface:#1b1918;
    --surface-2:#262322;
    --text:#f3f0ed;
    --muted:#b2aaa4;
    --line:#383330;
    --accent:#e0824a;
    --accent-soft:#3a2a1d;
    --shadow:0 18px 42px rgba(0,0,0,.22);
    --watermark:rgba(243,240,237,.055);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  button,a{font:inherit}
  button{color:inherit}
  a{color:inherit;text-decoration:none}
  body::before{
    content:"NEW DELHI DARBAR";
    position:fixed;
    z-index:0;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    user-select:none;
    color:var(--watermark);
    font-size:clamp(42px,9vw,120px);
    font-weight:750;
    letter-spacing:.14em;
    line-height:1;
    white-space:nowrap;
    transform:rotate(-14deg);
  }
  .shell{width:min(calc(100% - 28px),var(--max));margin:auto;position:relative;z-index:1}

  .brand-strip{
    display:flex;align-items:center;justify-content:center;
    margin:18px auto 2px;
  }
  .brand-strip-inner{
    width:100%;max-width:760px;
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:7px 10px;
    text-align:center;
  }
  .tag-chip{
    border:1px solid var(--line);
    background:color-mix(in srgb,var(--surface) 88%,var(--accent) 12%);
    border-radius:999px;
    padding:7px 11px;
    font-size:11px;line-height:1.25;
    letter-spacing:.02em;
    box-shadow:0 5px 16px rgba(55,43,29,.045);
  }
  .tag-chip.primary{
    border-color:var(--accent);
    background:var(--accent);
    font-weight:780;
    color:#fff;
    box-shadow:0 7px 18px color-mix(in srgb,var(--accent) 22%,transparent);
  }
  .tag-chip.specialty{
    font-weight:680;
    color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 42%,var(--line));
    background:color-mix(in srgb,var(--accent-soft) 48%,var(--surface));
  }
  .tag-chip.meta{
    color:var(--muted);
    background:var(--surface);
  }
  html[data-theme="dark"] .tag-chip.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#181210;
    box-shadow:0 8px 20px rgba(224,130,74,.18);
  }
  html[data-theme="dark"] .tag-chip.specialty{
    color:var(--accent);
    border-color:color-mix(in srgb,var(--accent) 48%,var(--line));
    background:color-mix(in srgb,var(--accent-soft) 70%,var(--surface));
  }
  @media(max-width:520px){
    .brand-strip{margin-top:15px}
    .brand-strip-inner{gap:6px 7px;padding:0 8px}
    .tag-chip{font-size:10px;padding:7px 9px}
    .tag-chip.meta{width:100%;}
  }
  .topbar{position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(140%) blur(16px);
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);
  }
  .topbar-inner{
    min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand{display:flex;flex-direction:column;min-width:0}
  .brand strong{font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .actions{display:flex;align-items:center;gap:8px}
  .language-picker{position:relative}
  .icon-btn,.lang-btn{
    border:1px solid var(--line);background:var(--surface);
    min-height:40px;border-radius:10px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform .18s ease,border-color .18s ease,background .18s ease;
  }
  .icon-btn{width:40px}
  .lang-btn{padding:0 11px;font-size:12px;font-weight:600;letter-spacing:.03em}
  .icon-btn:hover,.lang-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  .icon-btn:focus-visible,.lang-btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .hero{padding:44px 0 30px;text-align:center}
  .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:700}
  h1{font-size:clamp(32px,7vw,58px);line-height:1.02;letter-spacing:-.055em;margin:10px 0 8px;font-weight:760}
  .hero-rule{width:54px;height:1px;background:var(--accent);margin:18px auto}
  .contact{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
  .contact a{padding:3px 0;border-bottom:1px solid transparent}
  .contact a.phone{font-weight:800;font-style:italic}
  .contact a:hover{border-color:var(--accent);color:var(--text)}
  .toolbar{
    position:sticky;
    top:66px;
    z-index:15;
    display:flex;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:9px 0 12px;
    padding-right:18px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    scroll-padding-left:14px;
    scroll-padding-right:18px;
    background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:saturate(140%) blur(12px);
    border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);
  }
  .toolbar::-webkit-scrollbar{display:none}
  .cat-link{
    flex:0 0 auto;
    min-width:max-content;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:999px;
    padding:9px 13px;
    font-size:12px;
    font-weight:650;
    white-space:nowrap;
    transition:transform .18s ease,border-color .18s ease,background .18s ease,color .18s ease;
  }
  .cat-link:hover{border-color:var(--accent)}
  .cat-link.active{
    color:#fff;background:var(--accent);border-color:var(--accent);
    box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 20%,transparent);
  }
  html[data-theme="dark"] .cat-link.active{color:#181210}.cat-link:active{transform:scale(.98)}
  main{padding-bottom:34px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
  }
  .card.section-active{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
  .card.section-active .card-head{background:color-mix(in srgb,var(--accent-soft) 28%,var(--surface))}
  .card.section-active .card-head h2{color:var(--accent)}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:17px 18px 13px;border-bottom:1px solid var(--line);
  }
  .card h2{font-size:16px;letter-spacing:-.02em;margin:0;font-weight:720}.card-head h2::after{content:"";display:block;width:24px;height:2px;background:var(--accent);margin-top:8px;border-radius:999px}
  .count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .items{padding:3px 18px 9px}
  .item{
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;
    padding:15px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);transition:transform .28s cubic-bezier(.16,1,.3,1),background .28s ease;
  }
  .item:last-child{border-bottom:0}.item:hover{transform:translateX(3px)}
  .item-name{font-size:14px;font-weight:620;letter-spacing:-.012em}
  .item-note{font-size:11px;color:var(--muted);margin-top:3px}
  .price{
    font-size:13px;font-weight:850;white-space:nowrap;
    font-variant-numeric:tabular-nums;color:var(--accent);
    letter-spacing:-.01em;padding:5px 8px;border-radius:8px;
    background:color-mix(in srgb,var(--accent-soft) 58%,var(--surface));
    border:1px solid color-mix(in srgb,var(--accent) 26%,var(--line));
    align-self:start;
  }
  html[data-theme="dark"] .notice-label{color:#181210}
  html[data-theme="dark"] .price{
    color:var(--accent);
    background:color-mix(in srgb,var(--accent-soft) 78%,var(--surface));
    border-color:color-mix(in srgb,var(--accent) 34%,var(--line));
  }
  .source-price-missing{color:var(--muted);font-weight:550;font-size:11px;max-width:95px;text-align:right}
  .notice{
    margin:0 0 14px;padding:0;background:transparent;
    border:0;
    display:grid;gap:10px;
  }
  .notice-section{
    padding:16px 16px 17px;
    background:linear-gradient(135deg,
      color-mix(in srgb,var(--accent-soft) 52%,var(--surface)),
      var(--surface));
    border:1px solid color-mix(in srgb,var(--accent) 27%,var(--line));
    border-left:3px solid var(--accent);
    border-radius:16px;
    box-shadow:var(--shadow);
  }
  html[data-theme="dark"] .notice-section{
    background:linear-gradient(135deg,
      color-mix(in srgb,var(--accent-soft) 70%,var(--surface)),
      var(--surface));
  }
  .notice-label{
    display:inline-flex;align-items:center;gap:8px;margin:0 0 8px;
    padding:5px 8px;border-radius:999px;
    font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--accent);
  }
  .notice-label::before{
    content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto;
  }
  .notice p{margin:0;color:var(--muted);font-size:12px;line-height:1.65}
  .notice p strong{color:var(--text);font-weight:700}
  .bulk-list{list-style:none;margin:10px 0 11px;padding:0;display:grid;gap:6px;color:var(--text);font-size:12px}
  .bulk-list li{display:flex;align-items:center;gap:8px;min-height:30px;padding:6px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:620}
  .bulk-list li::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .bulk-price{padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
  .bulk-price strong{color:var(--text)}
  footer{border-top:1px solid var(--line);padding:24px 0 42px}
  .footer-grid{display:grid;gap:12px}
  .address{font-size:13px;color:var(--muted)}
  .address strong{color:var(--text);display:block;margin-bottom:4px}
  .source-note{font-size:10px;color:var(--muted);margin-top:18px;line-height:1.6}
  .lang-menu{
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    width:188px;
    padding:7px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 18px 44px rgba(20,27,23,.14);
    opacity:0;
    visibility:hidden;
    transform:translateY(-6px) scale(.98);
    transform-origin:top right;
    transition:opacity .16s ease,transform .16s ease,visibility .16s ease;
  }
  .lang-menu.open{
    opacity:1;
    visibility:visible;
    transform:translateY(0) scale(1);
  }
  .lang-menu-header{
    padding:7px 10px 8px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .lang-option{
    width:100%;
    min-height:44px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:9px 10px;
    border:0;
    background:transparent;
    color:var(--text);
    border-radius:11px;
    cursor:pointer;
    text-align:left;
    transition:background .14s ease;
  }
  .lang-option:hover,.lang-option:focus-visible{background:var(--surface-2);outline:none}
  .lang-option[aria-checked="true"]{background:var(--accent-soft)}
  .lang-option-main{display:flex;align-items:center;gap:10px;min-width:0}
  .lang-code{
    width:28px;height:28px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:8px;
    font-size:9px;font-weight:750;letter-spacing:.04em;
    color:var(--muted);background:var(--surface);
  }
  .lang-option[aria-checked="true"] .lang-code{
    color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  }
  .lang-name{font-size:13px;font-weight:600;line-height:1.1}
  .lang-native{font-size:11px;color:var(--muted);margin-top:2px}
  .lang-check{width:16px;height:16px;opacity:0;color:var(--accent);flex:0 0 auto}
  .lang-option[aria-checked="true"] .lang-check{opacity:1}
  @media(max-width:520px){
    .lang-menu{
      right:-4px;
      width:min(188px,calc(100vw - 28px));
    }
  }
  @media(max-width:520px){
    .notice{gap:8px}
    .notice-section{padding:14px 14px 15px;border-radius:14px}
    .notice-label{font-size:10px;margin-bottom:7px}
    .notice p{font-size:11.5px;line-height:1.62}
    .bulk-list{gap:5px;margin:9px 0 10px}
    .bulk-list li{min-height:32px;padding:6px 8px;font-size:11.5px}
    .bulk-price{padding-top:9px;margin-top:9px}
  }

  @media(max-width:699px){
    .toolbar{
      top:66px;
      margin-left:-14px;
      margin-right:-14px;
      padding-left:14px;
      padding-right:24px;
      gap:7px;
      overscroll-behavior-x:contain;
    }
    .cat-link{
      padding:9px 12px;
      font-size:11.5px;
    }
  }
  @media(min-width:700px){
    .shell{width:min(calc(100% - 48px),var(--max))}
    .hero{padding-top:60px}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
    .footer-grid{grid-template-columns:1fr auto;align-items:end}
    .notice{grid-column:1/-1}
  }
  @media(min-width:980px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .hero{padding-bottom:38px}
  }
  @media(max-width:520px){
    body::before{
      font-size:clamp(30px,10vw,54px);
      letter-spacing:.10em;
      transform:rotate(-12deg);
    }
  }
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{transition:none!important}
  }
</style>

  Taste Skill application: premium hospitality redesign.
  Design read: premium restaurant menu for phone-first customers.

  Direction: restrained cold-luxury, one accent, typography-first, minimal elevation, consistent radius.

</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="#" aria-label="New Delhi Darbar home">
      <strong id="brandName">New Delhi Darbar</strong><span id="brandTagline">Restaurant</span>
    </a>
    <div class="actions">
      <div class="language-picker">
        <button class="lang-btn" id="langButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu">
          <span id="langButtonLabel">English</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu" aria-label="Choose language">
          <div class="lang-menu-header">Language</div>
          <button class="lang-option" type="button" data-lang="en" role="menuitemradio" aria-checked="true">
            <span class="lang-option-main"><span class="lang-code">EN</span><span class="lang-native">English</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
          <button class="lang-option" type="button" data-lang="hi" role="menuitemradio" aria-checked="false">
            <span class="lang-option-main"><span class="lang-code">हि</span><span class="lang-native">हिन्दी</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
          <button class="lang-option" type="button" data-lang="gu" role="menuitemradio" aria-checked="false">
            <span class="lang-option-main"><span class="lang-code">ગુ</span><span class="lang-native">ગુજરાતી</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
        </div>
      </div>
      <button class="icon-btn" id="themeButton" type="button" aria-label="Switch theme" title="Switch theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <section class="hero">
    <div class="eyebrow" data-i18n="restaurant">Restaurant</div>
    <h1 id="brandH1">New Delhi Darbar</h1>
    <div class="hero-rule"></div>
    <div class="brand-strip" aria-label="Restaurant highlights">
      <div class="brand-strip-inner" id="brandStrip"></div>
    </div>
    <div class="contact" id="heroContact"></div>
  </section>

  <nav class="toolbar" aria-label="Menu categories" id="catNav"></nav>

  <main>
    <div id="stockNote" style="text-align:center; margin:8px 0 16px; font-size:12.5px; font-weight:700; color:var(--accent); letter-spacing:0.02em;" data-i18n="stockNote">Note: Whatever is in the stock will be served.</div>
    <div class="grid" id="menuGrid"></div>
  </main>

  <footer>
    <div class="footer-grid">
      <div class="address">
        <strong data-i18n="addressLabel">Address</strong>
        <a id="addressLink" href="#" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:5px;border-bottom:1px solid transparent;transition:border-color .18s ease,color .18s ease"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:0 0 auto"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Z"/><circle cx="12" cy="9" r="2.5"/></svg><span id="addressText">Address</span></a>
      </div>
      <div class="contact" id="footerContact"></div>
    </div>
    <div class="source-note" data-i18n="sourceNote">Prices and menu wording are preserved from the supplied menu. No tax or service-charge information is stated in the source.</div>
    <div class="source-note" style="margin-top:8px"><a href="admin.html" style="border-bottom:1px solid var(--line)">Admin Panel</a></div>
  </footer>
</div>

<script>
(async () => {
  const STORAGE_CONFIG = 'ndd-config-override';
  const STORAGE_CSV = 'ndd-csv-override';

  function loadConfig(){
    try {
      const raw = localStorage.getItem(STORAGE_CONFIG);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* fall through to default */ }
    return window.NDD_CONFIG;
  }

  function rowsToCategories(rows){
    const byId = new Map();
    rows.forEach(r => {
      const id = (r.category_id || '').trim();
      if (!id) return;
      if (!byId.has(id)) {
        byId.set(id, {
          id,
          order: Number(r.category_order) || 0,
          name: { en: r.category_en || '', hi: r.category_hi || '', gu: r.category_gu || '' },
          items: []
        });
      }
      const en = (r.item_en || '').trim();
      if (!en) return;
      byId.get(id).items.push({
        order: Number(r.item_order) || 0,
        en, hi: r.item_hi || '', gu: r.item_gu || '', price: r.price || ''
      });
    });
    const cats = [...byId.values()];
    cats.forEach(c => c.items.sort((a, b) => a.order - b.order));
    cats.sort((a, b) => a.order - b.order);
    return cats;
  }

  function parseCsv(text){
    const result = Papa.parse(text, { header: true, skipEmptyLines: true });
    return rowsToCategories(result.data);
  }

  function loadCategories(){
    return new Promise(resolve => {
      try {
        const raw = localStorage.getItem(STORAGE_CSV);
        if (raw) {
          const parsed = parseCsv(raw);
          // Ignore a stale/empty saved override rather than showing an empty menu.
          if (parsed.length) { resolve(parsed); return; }
          localStorage.removeItem(STORAGE_CSV);
        }
      } catch (e) { /* fall through to fetch */ }
      Papa.parse('menu.csv', {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: res => resolve(rowsToCategories(res.data)),
        error: () => {
          // e.g. opened via file:// where fetch is blocked — use the embedded copy
          if (window.NDD_MENU_CSV_FALLBACK) resolve(parseCsv(window.NDD_MENU_CSV_FALLBACK));
          else resolve([]);
        }
      });
    });
  }

  const config = loadConfig();
  const categories = await loadCategories();
  const DATA = { brand: config.brand, notices: config.notices, categories };

  function escAttr(s){
    return String(s == null ? '' : s).replace(/"/g,'&quot;');
  }

  function renderBrand(){
    document.getElementById('brandName').textContent = DATA.brand.name;
    document.getElementById('brandTagline').textContent = DATA.brand.tagline;
    document.getElementById('brandH1').textContent = DATA.brand.name;
    const strip = document.getElementById('brandStrip');
    strip.innerHTML = `
      <span class="tag-chip primary">${DATA.brand.since}</span>
      <span class="tag-chip specialty">${DATA.brand.specialty}</span>
      <span class="tag-chip meta">${DATA.brand.meta}</span>`;
    const contactHtml = DATA.brand.phones.map(p =>
      `<a class="phone" href="tel:${p.replace(/[^\d+]/g,'')}">${p}</a>`).join('');
    document.getElementById('heroContact').innerHTML = contactHtml;
    document.getElementById('footerContact').innerHTML = contactHtml;
    document.getElementById('addressLink').href = DATA.brand.mapUrl || '#';
    document.getElementById('addressText').textContent = DATA.brand.address;
  }

  function renderNav(){
    const nav = document.getElementById('catNav');
    nav.innerHTML = DATA.categories.map(c =>
      `<a class="cat-link" href="#${c.id}" data-cat="${c.id}"></a>`).join('');
  }

  function renderMenu(){
    const grid = document.getElementById('menuGrid');
    const sections = DATA.categories.map(cat => {
      const items = cat.items.map(it => `
        <div class="item">
          <div><div class="item-name" data-en="${escAttr(it.en)}" data-hi="${escAttr(it.hi)}" data-gu="${escAttr(it.gu)}">${it.en}</div></div>
          <div class="price">${it.price}</div>
        </div>`).join('');
      return `
        <section class="card" id="${cat.id}">
          <div class="card-head"><h2 data-cat-name="${cat.id}"></h2><span class="count">${cat.items.length}</span></div>
          <div class="items">${items}</div>
        </section>`;
    }).join('');

    const notices = DATA.notices.map(n => {
      const bulk = n.bulkList ? `<ul class="bulk-list">${n.bulkList.map(b =>
        `<li data-en="${escAttr(b.en)}" data-hi="${escAttr(b.hi)}" data-gu="${escAttr(b.gu)}">${b.en}</li>`).join('')}</ul>` : '';
      const bulkPricing = n.bulkPricing ? `<p class="bulk-price" data-notice-pricing></p>` : '';
      return `
        <section class="notice-section">
          <h3 class="notice-label" data-notice-title></h3>
          <p data-notice-html></p>
          ${bulk}
          ${bulkPricing}
        </section>`;
    }).join('');

    grid.innerHTML = sections + `<aside class="notice" aria-label="Restaurant notes">${notices}</aside>`;

    // Wire notice translations by index since they have no stable ids
    const noticeSections = grid.querySelectorAll('.notice-section');
    noticeSections.forEach((el, i) => {
      const n = DATA.notices[i];
      el._notice = n;
    });
  }

  const root = document.documentElement;
  const themeButton = document.getElementById('themeButton');
  const themeIcon = document.getElementById('themeIcon');
  const langButton = document.getElementById('langButton');
  const langMenu = document.getElementById('langMenu');
  const langButtonLabel = document.getElementById('langButtonLabel');
  const languagePicker = document.querySelector('.language-picker');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  const STORAGE_THEME = 'ndd-theme';
  const STORAGE_LANG = 'ndd-language';

  const translations = {
    en:{
      restaurant:'Restaurant', chicken:'Chicken Item', mutton:'Mutton Item', fish:'Fish Item',
      notListed:'Price not shown in source',
      addressLabel:'Address'
    },
    hi:{
      restaurant:'रेस्तरां', notListed:'स्रोत में कीमत नहीं दी गई है',
      addressLabel:'पता'
    },
    gu:{
      restaurant:'રેસ્ટોરન્ટ', notListed:'સ્રોતમાં કિંમત દર્શાવેલી નથી',
      addressLabel:'સરનામું'
    }
  };

  const langNames = {en:'English', hi:'हिन्दी', gu:'ગુજરાતી'};

  /* Bug 6: sync theme-color meta with current theme */
  function applyTheme(theme){
    root.dataset.theme = theme;
    localStorage.setItem(STORAGE_THEME, theme);
    const dark = theme === 'dark';
    if (themeMeta) themeMeta.content = dark ? '#121110' : '#f5f2ed';
    themeButton.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    themeButton.title = dark ? 'Switch to light theme' : 'Switch to dark theme';
    themeIcon.innerHTML = dark
      ? '<circle cx="12" cy="12" r="3.2"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>'
      : '<path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"></path>';
  }

  /* Bug 5: also translate bulk-list items that have data-en/hi/gu */
  function applyLanguage(lang){
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (t[key] !== undefined) el.textContent = t[key];
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.dataset.i18nHtml;
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.dataset[lang] || el.dataset.en;
    });
    document.querySelectorAll('.cat-link[data-cat]').forEach(el => {
      const cat = DATA.categories.find(c => c.id === el.dataset.cat);
      if (cat) el.textContent = cat.name[lang] || cat.name.en;
    });
    document.querySelectorAll('[data-cat-name]').forEach(el => {
      const cat = DATA.categories.find(c => c.id === el.dataset.catName);
      if (cat) el.textContent = cat.name[lang] || cat.name.en;
    });
    document.querySelectorAll('.notice-section').forEach(el => {
      const n = el._notice;
      if (!n) return;
      const titleEl = el.querySelector('[data-notice-title]');
      if (titleEl) titleEl.textContent = n.title[lang] || n.title.en;
      const htmlEl = el.querySelector('[data-notice-html]');
      if (htmlEl) htmlEl.innerHTML = n.html[lang] || n.html.en;
      const pricingEl = el.querySelector('[data-notice-pricing]');
      if (pricingEl && n.bulkPricing) pricingEl.innerHTML = n.bulkPricing[lang] || n.bulkPricing.en;
    });
    const stockEl = document.getElementById('stockNote');
    if (stockEl && DATA.brand.stockNote) stockEl.textContent = DATA.brand.stockNote[lang] || DATA.brand.stockNote.en;
    const sourceEl = document.querySelector('.source-note[data-i18n="sourceNote"]');
    if (sourceEl && DATA.brand.sourceNote) sourceEl.textContent = DATA.brand.sourceNote[lang] || DATA.brand.sourceNote.en;
    document.querySelectorAll('[data-lang]').forEach(el => {
      el.setAttribute('aria-checked', String(el.dataset.lang === lang));
    });
    langButtonLabel.textContent = langNames[lang];
    document.documentElement.lang = lang;
    localStorage.setItem(STORAGE_LANG, lang);
  }

  renderBrand();
  renderNav();
  renderMenu();

  const savedTheme = localStorage.getItem(STORAGE_THEME);
  const initialTheme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(initialTheme);

  const savedLang = localStorage.getItem(STORAGE_LANG) || 'en';
  applyLanguage(savedLang);

  themeButton.addEventListener('click', () => {
    applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'j') {
      e.preventDefault();
      applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    }
    if (e.key === 'Escape') {
      langMenu.classList.remove('open');
      langButton.setAttribute('aria-expanded','false');
    }
  });

  /* Bug 1: use setTimeout so focus() fires after visibility transition starts */
  function setLanguageMenu(open){
    langMenu.classList.toggle('open', open);
    langButton.setAttribute('aria-expanded', String(open));
    if(open){
      const selected = langMenu.querySelector('[aria-checked="true"]');
      if(selected) setTimeout(() => selected.focus(), 20);
    }
  }

  langButton.addEventListener('click', () => {
    setLanguageMenu(!langMenu.classList.contains('open'));
  });

  const languageOptions = [...langMenu.querySelectorAll('[data-lang]')];
  languageOptions.forEach((btn, index) => {
    btn.addEventListener('click', () => {
      applyLanguage(btn.dataset.lang);
      setLanguageMenu(false);
      langButton.focus();
    });
    btn.addEventListener('keydown', e => {
      if(e.key === 'ArrowDown'){
        e.preventDefault();
        languageOptions[(index + 1) % languageOptions.length].focus();
      } else if(e.key === 'ArrowUp'){
        e.preventDefault();
        languageOptions[(index - 1 + languageOptions.length) % languageOptions.length].focus();
      } else if(e.key === 'Home'){
        e.preventDefault(); languageOptions[0].focus();
      } else if(e.key === 'End'){
        e.preventDefault(); languageOptions[languageOptions.length - 1].focus();
      } else if(e.key === 'Escape'){
        e.preventDefault(); setLanguageMenu(false); langButton.focus();
      }
    });
  });

  langButton.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      setLanguageMenu(true);
    }
  });

  document.addEventListener('click', e => {
    if(!languagePicker.contains(e.target)) setLanguageMenu(false);
  });

  const categoryLinks = [...document.querySelectorAll('.cat-link')];
  const categoryCards = [...document.querySelectorAll('.card[id]')];

  /* Bug 2: scrollLock prevents observer from overriding click-set active state */
  let scrollLock = false;
  let scrollLockTimer = 0;

  /* Bug 4: auto-scroll the active toolbar link into view on mobile */
  function setActiveCategory(id){
    categoryLinks.forEach(link => {
      const active = link.getAttribute('href') === '#' + id;
      link.classList.toggle('active', active);
      if (active) {
        link.setAttribute('aria-current','page');
        link.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
      } else {
        link.removeAttribute('aria-current');
      }
    });
    categoryCards.forEach(card => card.classList.toggle('section-active', card.id === id));
  }

  categoryLinks.forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();
      const id = link.getAttribute('href').slice(1);
      const card = document.getElementById(id);
      if (!card) return;

      /* Bug 2: lock observer during programmatic scroll */
      scrollLock = true;
      clearTimeout(scrollLockTimer);
      setActiveCategory(id);

      const headerHeight = document.querySelector('.topbar')?.offsetHeight || 66;
      const toolbarHeight = document.querySelector('.toolbar')?.offsetHeight || 54;
      const top = card.getBoundingClientRect().top + window.scrollY - headerHeight - toolbarHeight - 10;
      window.scrollTo({top, behavior:'smooth'});

      /* Release lock after scroll settles */
      scrollLockTimer = setTimeout(() => { scrollLock = false; }, 800);
    });
  });

  /* Bug 3: track all intersecting entries globally; pick topmost visible */
  const visibleCards = new Map();
  const categoryObserver = new IntersectionObserver(entries => {
    if (scrollLock) return; /* Bug 2 */
    entries.forEach(e => {
      if (e.isIntersecting) visibleCards.set(e.target.id, e.boundingClientRect.top);
      else visibleCards.delete(e.target.id);
    });
    if (visibleCards.size) {
      let topId = null, topY = Infinity;
      visibleCards.forEach((y, id) => { if (y < topY) { topY = y; topId = id; } });
      /* Re-read live position for accuracy */
      let bestId = topId;
      let bestY = Infinity;
      visibleCards.forEach((_, id) => {
        const el = document.getElementById(id);
        if (el) {
          const r = el.getBoundingClientRect().top;
          if (r < bestY && r > -el.offsetHeight * 0.7) { bestY = r; bestId = id; }
        }
      });
      setActiveCategory(bestId);
    }
  }, {rootMargin:'-120px 0px -40% 0px', threshold:[0, 0.1, 0.25]});

  categoryCards.forEach(card => categoryObserver.observe(card));
  setActiveCategory(categoryCards[0]?.id || (DATA.categories[0] && DATA.categories[0].id));

  window.addEventListener('storage', e => {
    if (e.key === STORAGE_CONFIG || e.key === STORAGE_CSV) location.reload();
  });

})();
</script>
</body>
</html>
