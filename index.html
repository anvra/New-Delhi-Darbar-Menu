<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ed">
<meta name="description" content="New Delhi Darbar Restaurant digital menu — chicken, mutton, fish, rice, roti and beverages. Valsad.">
<title>New Delhi Darbar — Menu</title>
<link rel="icon" type="image/png" href="assets/img/favicon-light.png">
<link rel="stylesheet" href="src/pages/menu.css">
</head>
<body>
<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="#" aria-label="New Delhi Darbar home">
      <div class="brand-logo">
        <img class="logo-light" src="assets/img/logo-light.png" alt="" width="36" height="36">
        <img class="logo-dark" src="assets/img/logo-dark.png" alt="" width="36" height="36">
      </div>
      <div class="brand-text">
        <strong id="brandName">New Delhi Darbar</strong><span id="brandTagline">Restaurant</span>
      </div>
    </a>
    <div class="actions">
      <div class="language-picker">
        <button class="lang-btn" id="langButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="langMenu">
          <span id="langButtonLabel">English</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="lang-menu" id="langMenu" role="menu" aria-label="Choose language">
          <div class="lang-menu-header" id="langMenuHeader">Language</div>
          <button class="lang-option" type="button" data-lang="en" role="menuitemradio" aria-checked="true">
            <span class="lang-option-main"><span class="lang-code">EN</span><span class="lang-native">English</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
          <button class="lang-option" type="button" data-lang="hi" role="menuitemradio" aria-checked="false">
            <span class="lang-option-main"><span class="lang-code">हि</span><span class="lang-native">हिन्दी</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
          <button class="lang-option" type="button" data-lang="gu" role="menuitemradio" aria-checked="false">
            <span class="lang-option-main"><span class="lang-code">ગુ</span><span class="lang-native">ગુજરાતી</span></span>
            <svg class="lang-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
        </div>
      </div>
      <button class="icon-btn" id="themeButton" type="button" aria-label="Switch theme" title="Switch theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.7 6.7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="shell">
  <section class="hero">
    <div class="eyebrow" data-i18n="restaurant">Restaurant</div>
    <h1 id="brandH1">New Delhi Darbar</h1>
    <div class="hero-rule"></div>
    <div class="brand-strip" aria-label="Restaurant highlights">
      <div class="brand-strip-inner" id="brandStrip"></div>
    </div>
    <div class="contact" id="heroContact"></div>
  </section>

  <nav class="toolbar" aria-label="Menu categories" id="catNav"></nav>

  <main>
    <div class="stock-note" id="stockNote"></div>
    <div class="grid" id="menuGrid"></div>
  </main>

  <footer>
    <div class="footer-grid">
      <div class="address">
        <strong data-i18n="addressLabel">Address</strong>
        <a id="addressLink" class="address-link" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7Z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <span id="addressText"></span>
        </a>
      </div>
      <div class="contact" id="footerContact"></div>
    </div>
    <div class="source-note" id="sourceNote"></div>
    <div class="source-note admin-link"><a href="admin.html" data-i18n="adminPanel">Admin Panel</a></div>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="src/core/config.js"></script>
<script src="src/core/menu-fallback.js"></script>
<script src="src/core/glossary.js"></script>
<script src="src/core/i18n.js"></script>
<script src="src/core/store.js"></script>
<script src="src/pages/menu.js"></script>
</body>
</html>
